<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ANYA screenshot 2</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 108px;
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .kicker {
      margin: 0 0 14px;
      color: #f2c718;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 56px;
      font-size: 52px;
      line-height: 1.05;
      letter-spacing: -.03em;
    }
    .note {
      width: 560px;
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 16px;
      padding: 22px 24px 22px 20px;
      border-radius: 22px;
      background: #2a2a2c;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    }
    .note img {
      width: 56px;
      height: 56px;
      border-radius: 14px;
    }
    .note strong {
      display: block;
      font-size: 17px;
      letter-spacing: -.01em;
    }
    .note p {
      margin: 4px 0 0;
      color: #d0d0d2;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <p class="kicker">Leave the tab</p>
  <h1>When it finishes — or asks<br>you something — you get told.</h1>
  <div class="note">
    <img src="../../icons/notification.png" alt="">
    <div>
      <strong>AI needs your attention</strong>
      <p>Claude has finished. Click to return.</p>
    </div>
  </div>
</body>
</html>
