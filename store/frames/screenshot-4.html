<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ANYA screenshot 4</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 108px;
      background: #fff;
      color: #101010;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .kicker {
      margin: 0 0 14px;
      color: #5f4f00;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 48px;
      font-size: 52px;
      line-height: 1.05;
      letter-spacing: -.03em;
    }
    ul {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 72px;
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid #e8e8e8;
    }
    li {
      padding: 26px 0;
      border-bottom: 1px solid #e8e8e8;
      font-size: 22px;
      letter-spacing: -.01em;
    }
  </style>
</head>
<body>
  <p class="kicker">On your machine</p>
  <h1>Detection stays local.<br>Nothing is sent away.</h1>
  <ul>
    <li>No backend</li>
    <li>No analytics</li>
    <li>No API keys</li>
    <li>No conversation text stored</li>
  </ul>
</body>
</html>
