<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ANYA promo marquee</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; }
    body {
      display: grid;
      grid-template-columns: 560px 1fr;
      background: #f2c718;
      color: #101010;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .mark {
      display: grid;
      place-items: center;
    }
    .mark img { width: 220px; height: 220px; }
    .copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-right: 80px;
    }
    h1 {
      margin: 0;
      font-size: 92px;
      letter-spacing: -.04em;
      line-height: .9;
    }
    p {
      margin: 22px 0 0;
      font-size: 28px;
      color: #5f4f00;
    }
  </style>
</head>
<body>
  <div class="mark">
    <img src="../../icons/mark.svg" alt="">
  </div>
  <div class="copy">
    <h1>ANYA</h1>
    <p>AI needs your attention.</p>
  </div>
</body>
</html>
