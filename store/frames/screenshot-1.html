<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ANYA screenshot 1</title>
  <link rel="stylesheet" href="popup-card.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
    body {
      display: grid;
      grid-template-columns: 1fr 390px;
      gap: 72px;
      align-items: center;
      padding: 0 96px 0 108px;
      background: #fff;
      color: #101010;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .copy { max-width: 560px; }
    .kicker {
      margin: 0 0 18px;
      color: #5f4f00;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: 64px;
      line-height: .95;
      letter-spacing: -.03em;
    }
    p {
      margin: 28px 0 0;
      max-width: 22em;
      color: #444;
      font-size: 22px;
      line-height: 1.35;
    }
    .popup { box-shadow: 0 18px 50px rgba(16, 16, 16, .14); }
  </style>
</head>
<body>
  <div class="copy">
    <p class="kicker">Anya</p>
    <h1>AI needs<br>your attention.</h1>
    <p>Give it as soon as you can.</p>
  </div>
  <!--popup-->
</body>
</html>
